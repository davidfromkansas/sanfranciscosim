<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>Simulate San Francisco. Explore SF's digital twin and meet the residents!</title>
    <!-- Link previews (iMessage, Slack, Discord, X, LinkedIn). Absolute URLs
         throughout: scrapers resolve nothing relative, and most never run
         JavaScript, which is why this lives here in the static HTML and not in
         anything Vite mounts. og.jpg is the feed banner cut to the 1200x630
         card size every one of these apps agrees on. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SF Sim" />
    <meta
      property="og:title"
      content="Simulate San Francisco. Explore SF's digital twin and meet the residents!"
    />
    <meta
      property="og:description"
      content="Simulate San Francisco. Explore SF's digital twin and meet the residents!"
    />
    <meta property="og:url" content="https://www.sfsim.net/" />
    <!-- og.jpg stays under 300 KB: WhatsApp drops the WHOLE card (title
         included, not just the thumbnail) when it cannot build a preview
         image, and its ceiling is well below what the other apps accept. -->
    <meta property="og:image" content="https://www.sfsim.net/og.jpg" />
    <meta property="og:image:secure_url" content="https://www.sfsim.net/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Illustrated San Francisco skyline: the Golden Gate Bridge, Coit Tower, Alcatraz and painted Victorians along the bay."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Simulate San Francisco. Explore SF's digital twin and meet the residents!"
    />
    <meta
      name="twitter:description"
      content="Simulate San Francisco. Explore SF's digital twin and meet the residents!"
    />
    <meta name="twitter:image" content="https://www.sfsim.net/og.jpg" />
    <meta
      name="description"
      content="Simulate San Francisco. Explore SF's digital twin and meet the residents!"
    />
    <!-- The r/simfrancisco cloud, cut to a circle so it reads as a round mark on
         a tab of any colour. 32 for the tab, 180 for an iOS home screen. -->
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/favicon-180.png" />
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="stylesheet" href="/src/ui-theme.css" />
    <link rel="stylesheet" href="/src/boot.css" />
  </head>
  <body>
    <canvas id="view"></canvas>
    <!-- Boot curtain. Inline markup (not built by JS) so the fog is on screen
         at first paint, ~20 s before the renderer exists on a cold 4G load.
         boot.js drives it and removes this whole subtree on reveal. -->
    <div id="boot">
      <div class="boot-sky"></div>
      <div class="boot-grid"><i></i></div>
      <!-- Tier 1: procedural SVG fog. Costs zero bytes and paints with the
           stylesheet, so there is fog on screen before any asset exists. -->
      <div class="boot-fog"><i></i><i></i><i></i><i></i></div>
      <!-- Tier 2: two Blender-rendered fog halves that slide apart on reveal,
           plus sparse foreground wisps for depth. Pure upgrades — if either
           never arrives, the SVG tier below just stays. -->
      <div class="boot-doors"><i></i><i></i></div>
      <div class="boot-wisps"><i></i><i></i></div>
      <!-- Soft dark pool under the console: white fog would otherwise swallow
           the neon. Sibling of .boot-core so the power-down flash cannot
           brighten it. -->
      <div class="boot-veil"></div>
      <div class="boot-core">
        <div class="boot-frame">
          <div class="boot-bar">
            <span class="boot-fill"></span>
            <span class="boot-scan"></span>
          </div>
          <div class="boot-readout">
            <span class="boot-status">INITIALIZING</span>
            <span class="boot-pct">0%</span>
          </div>
        </div>
      </div>
      <div class="boot-scanlines"></div>
    </div>
    <!-- The residents' feed. Empty for now, and covering the right quarter of
         the city rather than squeezing it — the canvas keeps the full window
         and carries on behind. Desktop only. -->
    <aside id="feed" aria-label="Neighbourhood feed"></aside>
    <div id="debug" hidden></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
