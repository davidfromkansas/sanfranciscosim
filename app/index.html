<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>San Francisco — data-accurate 3D city</title>
    <!-- The r/simfrancisco cloud, cut to a circle so it reads as a round mark on
         a tab of any colour. 32 for the tab, 180 for an iOS home screen. -->
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/favicon-180.png" />
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="stylesheet" href="/src/ui-theme.css" />
    <link rel="stylesheet" href="/src/boot.css" />
  </head>
  <body>
    <canvas id="view"></canvas>
    <!-- Boot curtain. Inline markup (not built by JS) so the fog is on screen
         at first paint, ~20 s before the renderer exists on a cold 4G load.
         boot.js drives it and removes this whole subtree on reveal. -->
    <div id="boot">
      <div class="boot-sky"></div>
      <div class="boot-grid"><i></i></div>
      <!-- Tier 1: procedural SVG fog. Costs zero bytes and paints with the
           stylesheet, so there is fog on screen before any asset exists. -->
      <div class="boot-fog"><i></i><i></i><i></i><i></i></div>
      <!-- Tier 2: two Blender-rendered fog halves that slide apart on reveal,
           plus sparse foreground wisps for depth. Pure upgrades — if either
           never arrives, the SVG tier below just stays. -->
      <div class="boot-doors"><i></i><i></i></div>
      <div class="boot-wisps"><i></i><i></i></div>
      <!-- Soft dark pool under the console: white fog would otherwise swallow
           the neon. Sibling of .boot-core so the power-down flash cannot
           brighten it. -->
      <div class="boot-veil"></div>
      <div class="boot-core">
        <div class="boot-frame">
          <div class="boot-bar">
            <span class="boot-fill"></span>
            <span class="boot-scan"></span>
          </div>
          <div class="boot-readout">
            <span class="boot-status">INITIALIZING</span>
            <span class="boot-pct">0%</span>
          </div>
        </div>
      </div>
      <div class="boot-scanlines"></div>
    </div>
    <!-- The residents' feed. Empty for now, and covering the right quarter of
         the city rather than squeezing it — the canvas keeps the full window
         and carries on behind. Desktop only. -->
    <aside id="feed" aria-label="Neighbourhood feed"></aside>
    <div id="attribution">
      © OpenStreetMap contributors, Overture Maps Foundation, City &amp; County of San Francisco, USGS
    </div>
    <div id="debug" hidden></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
